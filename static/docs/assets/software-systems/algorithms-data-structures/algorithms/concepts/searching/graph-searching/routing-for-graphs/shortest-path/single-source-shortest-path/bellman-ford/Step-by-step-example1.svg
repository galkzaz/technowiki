<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4B5563" />
    </marker>
    <marker id="arrow-neg" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-curved" viewBox="0 0 10 10" refX="26" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>

    <!-- Node Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>

    <style>
      .node-circle { fill: #2563EB; stroke: #1D4ED8; stroke-width: 2.5; filter: url(#shadow); }
      .node-text { fill: #FFFFFF; font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      
      .edge { fill: none; stroke: #4B5563; stroke-width: 2; marker-end: url(#arrow); }
      .edge-neg { fill: none; stroke: #DC2626; stroke-width: 2; marker-end: url(#arrow-neg); }
      .edge-curved-neg { fill: none; stroke: #DC2626; stroke-width: 2; marker-end: url(#arrow-curved); }
      
      .weight-bg { fill: #F9FAFB; rx: 4; ry: 4; }
      .weight-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1F2937; text-anchor: middle; dominant-baseline: central; }
      .weight-text-neg { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #DC2626; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F9FAFB" rx="12" />

  <!-- EDGES -->

  <!-- A -> B (6) -->
  <path d="M 100 225 L 280 120" class="edge" />
  <g transform="translate(182, 164)">
    <rect x="-14" y="-11" width="28" height="22" class="weight-bg" />
    <text class="weight-text">6</text>
  </g>

  <!-- A -> C (7) -->
  <path d="M 100 225 L 280 330" class="edge" />
  <g transform="translate(182, 286)">
    <rect x="-14" y="-11" width="28" height="22" class="weight-bg" />
    <text class="weight-text">7</text>
  </g>

  <!-- B -> C (8) -->
  <path d="M 280 120 L 280 330" class="edge" />
  <g transform="translate(280, 225)">
    <rect x="-14" y="-11" width="28" height="22" class="weight-bg" />
    <text class="weight-text">8</text>
  </g>

  <!-- B -> D (5) -->
  <path d="M 280 120 Q 420 105 560 120" class="edge" />
  <g transform="translate(420, 103)">
    <rect x="-14" y="-11" width="28" height="22" class="weight-bg" />
    <text class="weight-text">5</text>
  </g>

  <!-- D -> B (-2) -->
  <path d="M 560 120 Q 420 155 280 120" class="edge-curved-neg" />
  <g transform="translate(420, 147)">
    <rect x="-16" y="-11" width="32" height="22" class="weight-bg" />
    <text class="weight-text-neg">-2</text>
  </g>

  <!-- B -> E (-4) -->
  <path d="M 280 120 L 560 330" class="edge-neg" />
  <g transform="translate(440, 240)">
    <rect x="-16" y="-11" width="32" height="22" class="weight-bg" />
    <text class="weight-text-neg">-4</text>
  </g>

  <!-- C -> D (-3) -->
  <path d="M 280 330 L 560 120" class="edge-neg" />
  <g transform="translate(400, 210)">
    <rect x="-16" y="-11" width="32" height="22" class="weight-bg" />
    <text class="weight-text-neg">-3</text>
  </g>

  <!-- C -> E (9) -->
  <path d="M 280 330 L 560 330" class="edge" />
  <g transform="translate(420, 330)">
    <rect x="-14" y="-11" width="28" height="22" class="weight-bg" />
    <text class="weight-text">9</text>
  </g>

  <!-- E -> D (7) -->
  <path d="M 560 330 L 560 120" class="edge" />
  <g transform="translate(560, 225)">
    <rect x="-14" y="-11" width="28" height="22" class="weight-bg" />
    <text class="weight-text">7</text>
  </g>

  <!-- NODES -->

  <!-- Node A -->
  <g transform="translate(100, 225)">
    <circle r="24" class="node-circle" />
    <text class="node-text">A</text>
  </g>

  <!-- Node B -->
  <g transform="translate(280, 120)">
    <circle r="24" class="node-circle" />
    <text class="node-text">B</text>
  </g>

  <!-- Node C -->
  <g transform="translate(280, 330)">
    <circle r="24" class="node-circle" />
    <text class="node-text">C</text>
  </g>

  <!-- Node D -->
  <g transform="translate(560, 120)">
    <circle r="24" class="node-circle" />
    <text class="node-text">D</text>
  </g>

  <!-- Node E -->
  <g transform="translate(560, 330)">
    <circle r="24" class="node-circle" />
    <text class="node-text">E</text>
  </g>
</svg>