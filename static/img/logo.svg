<svg width="112" height="102" viewBox="0 0 112 102"
     fill="none" xmlns="http://www.w3.org/2000/svg">

    <g stroke="#2563EB" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">

        <rect x="26" y="20" width="60" height="60" rx="8"/>

        <rect x="42" y="36" width="28" height="28" rx="4">
            <animate attributeName="stroke-opacity"
                     from="1" to="0.35"
                     dur="0.35s"
                     begin="mouseover"
                     fill="freeze"/>
            <animate attributeName="stroke-opacity"
                     from="0.35" to="1"
                     dur="0.35s"
                     begin="mouseout"
                     fill="freeze"/>
            </rect>

            <line x1="26" y1="50" x2="10" y2="50"/>
            <line x1="86" y1="50" x2="102" y2="50"/>
            <line x1="56" y1="20" x2="56" y2="4"/>
            <line x1="56" y1="80" x2="56" y2="98"/>
        </g>
    </svg>
